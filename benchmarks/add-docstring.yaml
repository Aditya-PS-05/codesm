name: "add-docstring"
description: "Add a docstring to the hello() function in docstring_target.py"

setup:
  - rm -f docstring_target.py
  - |
    cat > docstring_target.py <<'EOF'
    def hello():
        return 'world'
    EOF

prompt: |
  Open docstring_target.py. The hello() function has no docstring.
  Add a single line docstring to it that says: Return the string world.
  Do not rename the function or change its return value.

assertion:
  - test -f docstring_target.py
  - grep -q '"""' docstring_target.py
  - python3 -c "import ast; ast.parse(open('docstring_target.py').read())"
  - python3 -c "import importlib.util, sys; spec = importlib.util.spec_from_file_location('m', 'docstring_target.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); assert m.hello() == 'world'"

max_iterations: 15
timeout: 180
