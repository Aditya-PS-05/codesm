[project]
name = "codesm"
version = "0.1.0"
description = "An AI coding agent for the terminal. Built to study how coding models fail."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Aditya P S", email = "aditya.ps.05@gmail.com" },
]
keywords = [
    "ai",
    "agent",
    "coding",
    "llm",
    "cli",
    "react",
    "evaluation",
    "benchmark",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=1.4.0,<2",
    "openai>=3.8.0,<4",
    "ollama>=0.6.2,<0.7",
    "textual>=8.2.8,<9",
    "textual-image[textual]>=0.13.2,<0.14",
    "pillow>=12.3.0,<13",
    "typer>=0.27.2,<0.28",
    "pydantic>=2.13.5,<3",
    "httpx>=0.28.1,<0.29",
    "aiofiles>=25.1.0,<26",
    "rich>=15.0.0,<16",
    "pyyaml>=6.0.3,<7",
    "numpy>=2.5.2,<3",
    "tiktoken>=0.14.0,<0.15",
    "thefuzz>=0.22.1,<0.23",
    "pyperclip>=1.11.0,<2",
]

[project.optional-dependencies]
# Semantic code search via local sentence embeddings. Not installed by
# default because it pulls pytorch (~1.5 GB). Enable with:
#     pip install "codesm[search]"
search = [
    "sentence-transformers>=6.0.1,<7",
]
# HTTP API server (codesm serve). Installs FastAPI and Uvicorn on demand.
#     pip install "codesm[server]"
server = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.4,<0.53",
]
# PDF extraction for the `look_at` tool. Installs on demand.
#     pip install "codesm[pdf]"
pdf = [
    "pypdf>=6.17.0,<7",
    "pdfplumber>=0.11.10,<0.12",
]
dev = [
    "httpx2>=2.12.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
]
agents = [
    "claude-agent-sdk>=0.2.152,<0.3",
]

[project.urls]
Homepage = "https://github.com/Aditya-PS-05/codesm"
Repository = "https://github.com/Aditya-PS-05/codesm"
Issues = "https://github.com/Aditya-PS-05/codesm/issues"

[project.scripts]
codesm = "codesm.cli:app"

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codesm"]

[tool.hatch.build.targets.sdist]
include = [
    "codesm/",
    "benchmarks/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
